[build-system]
requires = ["setuptools>=77", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "pyEFPEHM"
description = "Python package for an efficient fully precessing eccentric inspiral model."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Gonzalo Morrás"},
    {name = "Geraint Pratten"},
    {name = "Patricia Schmidt"},
]
maintainers = [{name = "Gonzalo Morrás", email = "gonzalo.morras@ligo.org"}]
dynamic = ["version"]
dependencies = ["numpy", "scipy>=1.9.3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/gw-models/pyEFPEHM"
Repository = "https://github.com/gw-models/pyEFPEHM"

[project.entry-points."pycbc.waveform.fd"]
pyEFPEHM = "pyEFPEHM.waveform.plugins:pycbc_fd_plugin"

[project.entry-points."pycbc.waveform.td"]
pyEFPEHM = "pyEFPEHM.waveform.plugins:pycbc_td_plugin"

[project.entry-points."pycbc.waveform.fd_sequence"]
pyEFPEHM = "pyEFPEHM.waveform.plugins:pycbc_fd_sequence_plugin"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "pyEFPEHM.__version__"}

[tool.setuptools.packages.find]
include = ["pyEFPEHM*"]
